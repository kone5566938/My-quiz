<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple 專業檢定測驗</title>
    <!-- 引入 html2pdf 函式庫以支援 PDF 下載 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* ================= 排版與馬卡龍配色 ================= */
        :root {
            --macaron-pink: #FFB7B2;
            --macaron-blue: #A2E1DB;
            --macaron-yellow: #FDF9C4;
            --macaron-green: #B5EAD7;
            --macaron-purple: #D5AAFF;
            --text-dark: #4A4A4A;
        }

        body {
            background-color: var(--macaron-yellow);
            color: var(--text-dark);
            font-family: 'Helvetica Neue', Arial, 'LiHei Pro', '微軟正黑體', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: 1.3rem;
        }

        .container {
            background-color: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            padding: 40px;
            width: 100%;
            max-width: 800px;
        }

        h1, h2 {
            text-align: center;
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 1.4rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.4rem;
            border: 3px solid var(--macaron-blue);
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--macaron-purple);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            background-color: var(--macaron-blue);
            border: none;
            padding: 15px 25px;
            font-size: 1.3rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: #4A4A4A;
            font-weight: bold;
        }

        button:hover {
            filter: brightness(0.95);
            transform: translateY(-2px);
        }

        button.selected {
            background-color: var(--macaron-pink);
            color: white;
        }

        .btn-primary {
            background-color: var(--macaron-pink);
            color: white;
            width: 100%;
            font-size: 1.6rem;
            margin-top: 20px;
            padding: 20px;
        }

        /* 區塊顯示控制 */
        #quiz-section, #result-section { display: none; }

        /* 測驗區塊樣式 */
        .header-info {
            display: flex;
            justify-content: space-between;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
            background-color: var(--macaron-green);
            padding: 15px 20px;
            border-radius: 10px;
        }

        .question-text {
            font-size: 1.7rem;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 25px;
            background-color: #fcfcfc;
            border-left: 8px solid var(--macaron-purple);
            border-radius: 8px;
        }

        /* 選項直行排列 */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 20px 25px;
            background-color: white;
            border: 3px solid var(--macaron-blue);
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.5rem;
            transition: 0.2s;
        }

        .option-label:hover {
            background-color: #f0fbfa;
        }

        input[type="radio"] {
            transform: scale(2);
            margin-right: 25px;
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
        }

        .nav-buttons button { width: 30%; font-size: 1.4rem; padding: 15px;}
        
        .submit-btn { background-color: var(--macaron-pink) !important; color: white !important;}

        /* 結果與詳解區塊 */
        .result-item {
            margin-bottom: 25px;
            padding: 25px;
            border-radius: 10px;
            font-size: 1.3rem;
        }
        .correct { background-color: var(--macaron-green); }
        .wrong { background-color: var(--macaron-pink); }
        
        .explanation {
            margin-top: 15px;
        }
        
        .question-source-id {
            display: inline-block;
            background-color: #4A4A4A;
            color: white;
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div class="container" id="app-container">
    
    <!-- ================= 1. 首頁設定區塊 ================= -->
    <div id="setup-section">
        <h1 id="home-title">Apple 專業檢定測驗</h1>
        
        <div class="form-group">
            <label>請選擇測驗科目：</label>
            <div class="btn-group" id="subject-group">
                <button type="button" class="subject-btn selected" data-val="ios">iOS Expert 檢定</button>
                <button type="button" class="subject-btn" data-val="mac">Mac Specialist 檢定</button>
            </div>
        </div>

        <div class="form-group">
            <label>姓名：</label>
            <input type="text" id="student-name" placeholder="請輸入您的姓名">
        </div>

        <button class="btn-primary" onclick="startQuiz()">開始測驗 (共 20 題)</button>
    </div>

    <!-- ================= 2. 測驗進行區塊 ================= -->
    <div id="quiz-section">
        <h1 id="quiz-title">檢定測驗</h1>
        <div class="header-info">
            <span id="student-info-display"></span>
            <span id="timer-display">時間: 00:00</span>
        </div>
        
        <h2 id="question-number">第 1 題</h2>
        <div class="question-text" id="question-text">題目載入中...</div>
        
        <!-- 選項直行排列容器 -->
        <div class="options-container" id="options-container"></div>

        <div class="nav-buttons">
            <button id="prev-btn" onclick="prevQuestion()">上一頁</button>
            <button id="next-btn" onclick="nextQuestion()">下一頁</button>
            <button id="submit-btn" class="submit-btn" style="display:none;" onclick="submitQuiz()">繳交測驗</button>
        </div>
    </div>

    <!-- ================= 3. 成績區塊 ================= -->
    <div id="result-section">
        <h1 id="result-title">測驗結果</h1>
        <h2 id="final-score" style="font-size: 3.5rem; color: #D86B6B; margin-top: 0;"></h2>
        <div class="btn-group" style="justify-content: center; margin-bottom: 30px;">
            <button onclick="downloadCSV()" style="background-color: var(--macaron-blue);">下載 CSV 檔</button>
            <button onclick="downloadPDF()" style="background-color: var(--macaron-purple);">下載 PDF 檔</button>
            <button onclick="location.reload()" style="background-color: #eee; color: #333;">重新測驗</button>
        </div>
        <div id="explanation-container"></div>
    </div>

</div>

    // ==========================================

        [98, "X", "Apple TV+在台灣的每月訂閱價格為NT$250,若要增加觀看者必須額外增加費用,並且限定同住者才能觀看。"],
        [99, "X", "iCloud+包含額外 iCloud 儲存空間,目前只有2TB 及以上的iCloud+方案可以透過「家人共享」與家庭成員共用儲存空間。"],
        [100, "O", "訂閱 iCloud+之後會有「Apple活動邀約」、「iCloud 私密轉送」、「隱藏我的電子郵件」、「HomeKit 安全錄影」等實用功能。"]
    ];

    // 狀態變數 (固定20題)
    const selectedCount = 20; 
    let currentSubject = 'ios'; // 預設科目
    let quizQuestions = [];
    let currentQuestionIndex = 0;
    let userAnswers = [];
    let timerInterval;
    let secondsElapsed = 0;

    // --- 科目選擇切換邏輯 ---
    document.querySelectorAll('.subject-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            currentSubject = this.getAttribute('data-val');
        });
    });

    // --- 陣列洗牌函數 (Fisher-Yates) ---
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // --- 開始測驗 ---
    function startQuiz() {
        const studentName = document.getElementById('student-name').value.trim();
        
        if (!studentName) {
            alert("請輸入姓名！");
            return;
        }

        // 依據選擇的科目載入題庫
        const rawData = currentSubject === 'ios' ? iosRawData : macRawData;
        const subjectTitle = currentSubject === 'ios' ? 'iOS Expert 檢定' : 'Mac Specialist 檢定';
        
        // 格式化題庫物件
        const questionDatabase = rawData.map(item => {
            return {
                id: item[0],
                answer: item[1],
                text: item[2]
            };
        });

        // 複製題庫進行洗牌（避免重複抽題）
        let pool = [...questionDatabase];
        shuffleArray(pool);
        
        // 抽出指定題數 (此處為20題)
        const actualCount = Math.min(selectedCount, pool.length);
        quizQuestions = pool.slice(0, actualCount);
        userAnswers = new Array(actualCount).fill(null);

        // 切換畫面
        document.getElementById('setup-section').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'block';
        
        // 更新標題
        document.getElementById('quiz-title').innerText = subjectTitle;
        document.getElementById('result-title').innerText = subjectTitle + ' - 結果';
        document.getElementById('student-info-display').innerText = `考生：${studentName}`;

        // 啟動計時器
        secondsElapsed = 0;
        timerInterval = setInterval(updateTimer, 1000);

        renderQuestion();
    }

    // --- 計時器 ---
    function updateTimer() {
        secondsElapsed++;
        const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
        const s = (secondsElapsed % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `時間: ${m}:${s}`;
    }

    // --- 渲染題目與選項 ---
    function renderQuestion() {
        const q = quizQuestions[currentQuestionIndex];
        document.getElementById('question-number').innerText = `第 ${currentQuestionIndex + 1} 題 / 共 ${quizQuestions.length} 題`;
        document.getElementById('question-text').innerText = q.text;

        const container = document.getElementById('options-container');
        container.innerHTML = "";

        // 選項固定排列出現 (不再隨機打亂，O 在上、X 在下)
        let options = ["O", "X"];

        options.forEach(opt => {
            const label = document.createElement('label');
            label.className = "option-label";
            
            const radio = document.createElement('input');
            radio.type = "radio";
            radio.name = "answer";
            radio.value = opt;
            
            // 記憶已選答案
            if (userAnswers[currentQuestionIndex] === opt) {
                radio.checked = true;
            }

            radio.addEventListener('change', (e) => {
                userAnswers[currentQuestionIndex] = e.target.value;
            });

            label.appendChild(radio);
            label.appendChild(document.createTextNode(opt === "O" ? "正確 (O)" : "錯誤 (X)"));
            container.appendChild(label);
        });

        // 按鈕顯示邏輯
        document.getElementById('prev-btn').style.visibility = currentQuestionIndex === 0 ? 'hidden' : 'visible';
        
        if (currentQuestionIndex === quizQuestions.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'inline-block';
        } else {
            document.getElementById('next-btn').style.display = 'inline-block';
            document.getElementById('submit-btn').style.display = 'none';
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderQuestion();
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizQuestions.length - 1) {
            currentQuestionIndex++;
            renderQuestion();
        }
    }

    // --- 繳交與計分 ---
    function submitQuiz() {
        if (userAnswers.includes(null)) {
            const confirmSubmit = confirm("您還有題目未作答，確定要提早繳交嗎？");
            if (!confirmSubmit) return;
        }

        clearInterval(timerInterval);
        
        let correctCount = 0;
        let explanationHTML = "";

        quizQuestions.forEach((q, index) => {
            const userAns = userAnswers[index];
            const isCorrect = userAns === q.answer;
            if (isCorrect) correctCount++;

            const statusClass = isCorrect ? "correct" : "wrong";
            const statusText = isCorrect ? "✅ 答對" : "❌ 答錯";
            const userAnsText = userAns ? userAns : "未作答";

            // 無論對錯皆標示原題庫的題號
            explanationHTML += `
                <div class="result-item ${statusClass}">
                    <h3>第 ${index + 1} 題：${statusText}</h3>
                    <p><strong>題目：</strong>${q.text}</p>
                    <p><strong>您的作答：</strong>${userAnsText} &nbsp;&nbsp;|&nbsp;&nbsp; <strong>正確答案：</strong>${q.answer}</p>
                    <div class="explanation">
                        <span class="question-source-id">原題庫第 ${q.id} 題</span>
                    </div>
                </div>
            `;
        });

        const score = Math.round((correctCount / quizQuestions.length) * 100);

        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('final-score').innerText = `總分：${score} 分`;
        document.getElementById('explanation-container').innerHTML = explanationHTML;
    }

    // --- 匯出 CSV 檔 ---
    function downloadCSV() {
        const studentName = document.getElementById('student-name').value;
        const score = document.getElementById('final-score').innerText;
        const subjectTitle = currentSubject === 'ios' ? 'iOS_Expert' : 'Mac_Specialist';
        
        let csvContent = "\uFEFF"; // 加入 BOM 支援 Excel 中文顯示
        csvContent += "姓名,測驗科目,成績,測驗題號,原題庫題號,題目,您的作答,正確答案,結果\n";

        quizQuestions.forEach((q, index) => {
            const userAns = userAnswers[index] || "未作答";
            const isCorrect = userAns === q.answer ? "正確" : "錯誤";
            const safeText = q.text.replace(/"/g, '""'); // 處理 CSV 內的引號
            csvContent += `${studentName},${subjectTitle},${score},${index + 1},${q.id},"${safeText}",${userAns},${q.answer},${isCorrect}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `${subjectTitle}_檢定成績_${studentName}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // --- 匯出 PDF 檔 ---
    function downloadPDF() {
        const studentName = document.getElementById('student-name').value;
        const subjectTitle = currentSubject === 'ios' ? 'iOS_Expert' : 'Mac_Specialist';
        const element = document.getElementById('result-section');
        
        // 暫時隱藏按鈕區塊，避免被印進 PDF 內
        const btnGroup = element.querySelector('.btn-group');
        btnGroup.style.display = 'none';

        const opt = {
            margin:       10,
            filename:     `${subjectTitle}_檢定成績_${studentName}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            // 下載完成後恢復按鈕顯示
            btnGroup.style.display = 'flex';
        });
    }
</script>
